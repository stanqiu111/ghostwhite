{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Éthéré - Login</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: var(--gw-bg);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .login-container {
        /* was #f5f5f5: a fixed light card under text that follows the
           theme, so in dark mode it rendered light-on-light (1.1:1) */
        background-color: var(--gw-surface);
        border: 1px solid var(--gw-border);
        padding: 40px;
        border-radius: 12px;
        width: 100%;
        max-width: 400px;
      }

      /* Named for this page: `.header` / `.logo` belong to the app chrome in
         main.css, and reusing them here pulled in a sticky white bar. */
      .login-brand {
        --mark: 20px;
        --mark-gap: 12px;

        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--mark-gap);
        margin-bottom: 40px;

        /* Optical centring. Centring the group puts the mark on the left and
           pushes the wordmark -- which is what reads as the title -- half the
           mark's footprint to the right. Pull the group back by that much so
           "Éthéré" itself sits on the card's centre line. Derived from the
           two values above, so it stays correct if either changes. */
        transform: translateX(calc((var(--mark) + var(--mark-gap)) / -2));
      }

      .login-brand-dot {
        width: var(--mark);
        height: var(--mark);
        background-color: var(--gw-text);
        border-radius: 50%;
        flex: none;
      }

      .brand-name {
        font-size: var(--gw-text-2xl);
        font-weight: 600;
        color: var(--gw-text);
        letter-spacing: 0.01em;
        line-height: 1;
      }

      .form-group {
        margin-bottom: 24px;
      }

      .form-label {
        display: block;
        font-size: 14px;
        font-weight: 500;
        color: var(--gw-text);
        margin-bottom: 8px;
      }

      .form-input {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid var(--gw-border-str);
        border-radius: 8px;
        font-size: 16px;
        background-color: var(--gw-surface);
        transition: border-color 0.2s ease;
      }

      .form-input:focus {
        outline: none;
        border-color: var(--gw-accent);
      }

      .password-container {
        position: relative;
      }

      .password-toggle {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        padding: 4px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--gw-text-dim);
      }

      .password-toggle:hover {
        background-color: var(--gw-surface-2);
      }

      .password-toggle svg {
        width: 16px;
        height: 16px;
      }

      .button-group {
        display: flex;
        gap: 12px;
        margin-top: 32px;
      }

      .login-button,
      .signup-button {
        flex: 1;
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
        text-align: center;
        text-decoration: none;
        display: inline-block;
      }

      /* Whichever of Login / Signup is the current mode is the primary
         action. The mode used to be shown by JS writing hardcoded inline
         colours (#000 / #fff), which beat every stylesheet and ignored dark
         mode. JS now only toggles .is-active; the look lives here. */
      .login-button,
      .signup-button {
        background-color: var(--gw-surface);
        color: var(--gw-text);
        border: 1px solid var(--gw-border-str);
      }
      .login-button:hover,
      .signup-button:hover {
        background-color: var(--gw-surface-2);
      }
      .login-button.is-active,
      .signup-button.is-active {
        background-color: var(--gw-text);
        color: var(--gw-surface);
        border-color: var(--gw-text);
      }
      .login-button.is-active:hover,
      .signup-button.is-active:hover {
        background-color: var(--gw-text);
        opacity: 0.88;
      }

      .error-message {
        background-color: color-mix(in srgb, var(--gw-danger) 10%, transparent);
        color: var(--gw-danger);
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
        font-size: 14px;
        display: none;
      }

      /* was #3c3 on #efe -- 2.05:1, unreadable before dark mode existed */
      .success-message {
        background-color: color-mix(in srgb, var(--gw-success) 10%, transparent);
        color: var(--gw-success);
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
        font-size: 14px;
        display: none;
      }

      @media (max-width: 480px) {
        .login-container {
          padding: 30px 20px;
          margin: 10px;
        }

        .button-group {
          flex-direction: column;
          gap: 8px;
        }
      }
    </style>
  <link rel="icon" href="{% static 'images/favicon.svg' %}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{% static 'css/main.css' %}?v=5">
    <link rel="stylesheet" href="{% static 'css/theme.css' %}?v=5">
  <script src="{% static 'js/common.js' %}?v=5"></script>
</head>
  <body>
    <div class="login-container">
      <div class="login-brand">
        <span class="login-brand-dot" aria-hidden="true"></span>
        <div class="brand-name">Éthéré</div>
      </div>

      {% if already_logged_in %}
      <div id="already-logged-in-banner" style="
        background:var(--gw-warn-bg);border:1px solid color-mix(in srgb, var(--gw-warn-fg) 35%, transparent);
        border-radius:var(--gw-radius-sm);padding:12px 16px;margin-bottom:20px;
        font-size:14px;color:var(--gw-warn-fg);">
        <div style="margin-bottom:8px;">
          Already logged in as <strong>{{ logged_in_username }}</strong>.
        </div>
        <div style="display:flex;gap:8px;">
          <button type="button" onclick="window.location.href='/home/'" style="
            background:var(--gw-warn-fg);color:var(--gw-surface);border:none;border-radius:var(--gw-radius-sm);
            padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;">
            Go to Home
          </button>
          <button type="button" onclick="logout()" style="
            background:none;border:1px solid var(--gw-warn-fg);border-radius:var(--gw-radius-sm);
            padding:6px 14px;font-size:12px;color:var(--gw-warn-fg);cursor:pointer;">
            Log out &amp; switch account
          </button>
        </div>
      </div>
      {% endif %}

      <div id="error-message" class="error-message"></div>
      <div id="success-message" class="success-message"></div>

      <form id="auth-form">
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-input"
            required
          />
        </div>

        <div class="form-group" id="emailGroup" style="display:none;">
          <label for="email" class="form-label">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            placeholder="you@gmail.com"
          />
        </div>

        <div class="form-group">
          <label for="password1" class="form-label">Password</label>
          <div class="password-container">
            <input
              type="password"
              id="password1"
              name="password1"
              class="form-input"
              required
            />
            <button
              type="button"
              class="password-toggle"
              onclick="togglePassword('password1')"
            >
              <!-- Eye icon SVG -->
              <svg
                width="20"
                height="18"
                viewBox="0 0 20 18"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M19.25 6.14999C16.94 2.51999 13.56 0.429993 10 0.429993C8.22 0.429993 6.49 0.949993 4.91 1.91999C3.33 2.89999 1.91 4.32999 0.75 6.14999C-0.25 7.71999 -0.25 10.27 0.75 11.84C3.06 15.48 6.44 17.56 10 17.56C11.78 17.56 13.51 17.04 15.09 16.07C16.67 15.09 18.09 13.66 19.25 11.84C20.25 10.28 20.25 7.71999 19.25 6.14999ZM10 13.04C7.76 13.04 5.96 11.23 5.96 8.99999C5.96 6.76999 7.76 4.95999 10 4.95999C12.24 4.95999 14.04 6.76999 14.04 8.99999C14.04 11.23 12.24 13.04 10 13.04Z"
                  fill="currentColor"
                />
                <path
                  d="M10 6.14C8.43002 6.14 7.15002 7.42 7.15002 9C7.15002 10.57 8.43002 11.85 10 11.85C11.57 11.85 12.86 10.57 12.86 9C12.86 7.43 11.57 6.14 10 6.14Z"
                  fill="currentColor"
                />
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="password2" class="form-label">Confirm password</label>
          <div class="password-container">
            <input
              type="password"
              id="password2"
              name="password2"
              class="form-input"
            />
            <button
              type="button"
              class="password-toggle"
              onclick="togglePassword('password2')"
            >
              <svg
                width="20"
                height="18"
                viewBox="0 0 20 18"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M19.25 6.14999C16.94 2.51999 13.56 0.429993 10 0.429993C8.22 0.429993 6.49 0.949993 4.91 1.91999C3.33 2.89999 1.91 4.32999 0.75 6.14999C-0.25 7.71999 -0.25 10.27 0.75 11.84C3.06 15.48 6.44 17.56 10 17.56C11.78 17.56 13.51 17.04 15.09 16.07C16.67 15.09 18.09 13.66 19.25 11.84C20.25 10.28 20.25 7.71999 19.25 6.14999ZM10 13.04C7.76 13.04 5.96 11.23 5.96 8.99999C5.96 6.76999 7.76 4.95999 10 4.95999C12.24 4.95999 14.04 6.76999 14.04 8.99999C14.04 11.23 12.24 13.04 10 13.04Z"
                  fill="currentColor"
                />
                <path
                  d="M10 6.14C8.43002 6.14 7.15002 7.42 7.15002 9C7.15002 10.57 8.43002 11.85 10 11.85C11.57 11.85 12.86 10.57 12.86 9C12.86 7.43 11.57 6.14 10 6.14Z"
                  fill="currentColor"
                />
              </svg>
            </button>
          </div>
        </div>

        <div class="button-group">
          <button type="button" class="login-button" onclick="handleLogin()">
            Login
          </button>
          <button type="button" class="signup-button" onclick="handleSignup()">
            Signup
          </button>
        </div>
      </form>
    </div>

    <script src="{% static 'js/api.js' %}?v=5"></script>
    <script>
      let isSignupMode = false; // for login mode, we only shows 1 password input, for signup mode, we shows 2 password inputs

      function togglePassword(inputId) {
        // here the original input type is password, so by toggling, we will convert it to text and vice versa
        const input = document.getElementById(inputId);

        if (input.type === "password") {
          input.type = "text";
        } else {
          input.type = "password";
        }
      }

      // Mark which of Login / Signup is the primary action; CSS owns the colours.
      function setActiveMode(mode) {
        document.querySelector(".login-button").classList.toggle("is-active", mode === "login");
        document.querySelector(".signup-button").classList.toggle("is-active", mode === "signup");
      }

      function toggleMode() {
        isSignupMode = !isSignupMode;
        const password2Group = document.querySelector(
          'label[for="password2"]'
        ).parentElement;

        if (isSignupMode) {
          // Show email + password2 fields
          document.getElementById("emailGroup").style.display = "block";
          document.getElementById("email").required = true;
          password2Group.style.display = "block";
          document.getElementById("password2").required = true;

          setActiveMode("signup");
        } else {
          // Hide email + password2 fields
          document.getElementById("emailGroup").style.display = "none";
          document.getElementById("email").required = false;
          document.getElementById("email").value = "";
          password2Group.style.display = "none";
          document.getElementById("password2").required = false;
          document.getElementById("password2").value = "";

          setActiveMode("login");
        }
      }

      function handleLogin() {
        // if signup mode was selected, switch to login mode
        if (isSignupMode) {
          toggleMode();
        } else {
          // validate and send information to call login API
          const validationError = validateInputs();
          if (validationError) {
            showError(validationError);
            return;
          }

          const username = document.getElementById("username").value;
          const password = document.getElementById("password1").value;
          const data = {
            username: username,
            password: password,
          };
          fetch("/api/authors/login/", {
            method: "POST",
            headers: getHeaders(),
            body: JSON.stringify(data),
          })
            .then(async (response) => {
              const status = response.status;
              const data = await response.json().catch(() => ({}));
              console.log(data);
              
              // Pending approval: backend returns 403 with {"error": "..."}
              if (status === 403) {
                showError(data.error || "Your account is pending admin approval.");
                return;
              }

              // Successful login
              if (response.ok && data.access) {
                showSuccess("Login successful");
                // Store tokens and redirect
                localStorage.setItem("access_token", data.access);
                localStorage.setItem("refresh_token", data.refresh);
                localStorage.setItem("user_id", data.user_id);
                localStorage.setItem("username", username);
                setTimeout(() => {
                  window.location.href = "/home/";
                }, 1500);
              } else {
                showError("Invalid username or password");
              }
            })
            .catch((error) => {
              console.error("Error:", error);
              showError("Network error. Please try again.");
            });
        }
      }

      function handleSignup() {
        // if login mode was selected, switch to signup mode
        if (!isSignupMode) {
          toggleMode();
        } else {
          // validate and send information to call signup API
          const validationError = validateInputs();
          if (validationError) {
            showError(validationError);
            return;
          }

          const username = document.getElementById("username").value;
          const email = document.getElementById("email").value;
          const password = document.getElementById("password1").value;
          const password2 = document.getElementById("password2").value;
          const data = {
            username: username,
            display_name: username,
            email: email,
            password: password,
            password2: password2,
            bio: "",
            github_url: "",
          };
          fetch("/api/authors/register/", {
            method: "POST",
            headers: getHeaders(),
            body: JSON.stringify(data),
          })
            .then(async (response) => {
              const status = response.status;
              const data = await response.json().catch(() => ({}));
              if (status === 201 && data.status === "pending_verification") {
                showSuccess("Account created! Check your email to verify your address before logging in.");
                document.getElementById("email").value = "";
                document.getElementById("password1").value = "";
                document.getElementById("password2").value = "";
                return;
              }
                
              else {
                // Handle validation errors
                let errorMessage = "Registration failed. ";
                if (data.password) {
                  const passwordErrors = data.password;
                  if (
                    passwordErrors.some((error) => error.includes("too common"))
                  ) {
                    errorMessage +=
                      "Password is too common. Please use a stronger password with at least 8 characters, including uppercase, lowercase, numbers, and special characters.";
                  } else if (
                    passwordErrors.some((error) => error.includes("too short"))
                  ) {
                    errorMessage +=
                      "Password is too short. Please use at least 8 characters.";
                  } else if (
                    passwordErrors.some((error) =>
                      error.includes("entirely numeric")
                    )
                  ) {
                    errorMessage +=
                      "Password cannot be entirely numeric. Please include letters and special characters.";
                  } else {
                    errorMessage += passwordErrors.join(", ");
                  }
                } else if (data.email) {
                  errorMessage += data.email.join(", ");
                } else if (data.username) {
                  errorMessage += data.username.join(", ");
                } else if (data.non_field_errors) {
                  errorMessage += data.non_field_errors.join(", ");
                } else {
                  errorMessage += "Please check your input.";
                }
                showError(errorMessage);
              }
            })
            .catch((error) => {
              console.error("Error:", error);
              showError("Network error. Please try again.");
            });
        }
      }

      function validateInputs() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password1").value;
        const password2 = document.getElementById("password2").value;
        if (isSignupMode) {
          if (password !== password2) {
            return "Passwords don't match";
          }
          if (password === "" || password2 === "" || username === "") {
            return "Please fill in all fields";
          }
        }
        if (password === "" || username === "") {
          // log in mode
          return "Please fill in all fields";
        }
        return null;
      }

      function showError(message) {
        const errorDiv = document.getElementById("error-message");
        const successDiv = document.getElementById("success-message");
        errorDiv.innerHTML = message;
        errorDiv.style.display = "block";
        successDiv.style.display = "none";
      }

      function showSuccess(message) {
        const successDiv = document.getElementById("success-message");
        const errorDiv = document.getElementById("error-message");
        successDiv.textContent = message;
        successDiv.style.display = "block";
        errorDiv.style.display = "none";
      }

      function clearMessages() {
        document.getElementById("error-message").style.display = "none";
        document.getElementById("success-message").style.display = "none";
      }

      // Initialize the page
      document.addEventListener("DOMContentLoaded", function () {
        // Hide password2 field initially (login mode)
        const password2Group = document.querySelector(
          'label[for="password2"]'
        ).parentElement;
        password2Group.style.display = "none";
        document.getElementById("password2").required = false;

        setActiveMode("login");
      });
    </script>
  </body>
</html>
