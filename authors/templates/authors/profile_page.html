  <main class="layout">
    <section class="profile-card">
      <figure class="mainAvatar">
       <img class="avatar lg" id="mainAvatar" 
            src="" data-fallback="{% static 'authors/avatar1.jpg' %}"
            alt="User Avatar">
        <div class="avatar-overlay">
          <button id="uploadBtn" type="button" class="upload-btn">
            <svg width="20" height="20" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M10.5 3.50001C10.1442 3.50001 9.81748 3.29584 9.65415 2.98084L9.23415 2.13501C8.96582 1.60417 8.26582 1.16667 7.67082 1.16667H6.33499C5.73415 1.16667 5.03415 1.60417 4.76582 2.13501L4.34582 2.98084C4.18249 3.29584 3.85582 3.50001 3.49999 3.50001C2.23415 3.50001 1.23082 4.5675 1.31249 5.8275L1.61582 10.6458C1.68582 11.8475 2.33332 12.8333 3.94332 12.8333H10.0567C11.6667 12.8333 12.3083 11.8475 12.3842 10.6458L12.6875 5.8275C12.7692 4.5675 11.7658 3.50001 10.5 3.50001ZM6.12499 4.22917H7.87499C8.11415 4.22917 8.31249 4.42751 8.31249 4.66667C8.31249 4.90584 8.11415 5.10417 7.87499 5.10417H6.12499C5.88582 5.10417 5.68749 4.90584 5.68749 4.66667C5.68749 4.42751 5.88582 4.22917 6.12499 4.22917ZM6.99999 10.57C5.91499 10.57 5.02832 9.68917 5.02832 8.59834C5.02832 7.5075 5.90915 6.62667 6.99999 6.62667C8.09082 6.62667 8.97165 7.5075 8.97165 8.59834C8.97165 9.68917 8.08499 10.57 6.99999 10.57Z" fill="#EDEDED"/>
            </svg>
          </button>
        </div>
        <input type="file" id="avatarInput" accept="image/*" style="display:none;">
      </figure>
      

      <section class="profile-stats">
        <h2 class="profile-name" id="profile-name"></h2>
        <ul class="stats">
          <li id="statEntries">
            <span class="num">200</span><br>
            <span class="label">Entries</span>
          </li>
          <li id="statFollowers">
            <span class="num">100</span><br>
            <span class="label">Followers</span>
          </li>
          <li id="statFollowing">
            <span class="num">105</span><br>
            <span class="label">Following</span>
          </li>
        </ul>
      </section>

      <section class="friends">
        <h3>Friends</h3>
        <ul class="friend-grid" id="friendsGrid"><li><img src="https://i.pravatar.cc/80?img=1" alt="Friend 1"></li>
            <li><img src="https://i.pravatar.cc/80?img=2" alt="Friend 2"></li>
            <li><img src="https://i.pravatar.cc/80?img=3" alt="Friend 3"></li>
            <li><img src="https://i.pravatar.cc/80?img=4" alt="Friend 4"></li>
            <li><img src="https://i.pravatar.cc/80?img=5" alt="Friend 5"></li>
        </ul>
      </section>
    </section>


    <section class="profile-detail">
      <h2>Profile Details</h2>

      <form id="profileForm">
        <section class="profile-fields">
          <label>Username
            <input id="username" name="username" disabled autocomplete="username">
          </label>

          <label>Display name
            <input id="display_name" name="display_name" required>
          </label>

          <label>Github URL
            <input id="github_url" name="github_url" placeholder="https://github.com/username">
          </label>

          <label>Bio
            <textarea id="bio" name="bio"></textarea>
          </label>
        </section>

        <button id="saveBtn" class="saveBtn" type="submit">Save</button>
      </form>

      <hr>

      <section class="entries">
        <h3>Entries</h3>
        <ul class="gallery" id="entriesGallery">
              <li><img src="https://i.pravatar.cc/200?img=10" alt="Entry 1"></li>
              <li><img src="https://i.pravatar.cc/200?img=11" alt="Entry 2"></li>
              <li><img src="https://i.pravatar.cc/200?img=12" alt="Entry 3"></li>
              <li><img src="https://i.pravatar.cc/200?img=13" alt="Entry 4"></li>
              <li><img src="https://i.pravatar.cc/200?img=14" alt="Entry 5"></li>
          <li class="upload-tile no-image">
            <button class="upload-btn" type="button">
                <svg width="35" height="35" viewBox="0 0 24 24" fill="none"
                xmlns="http://www.w3.org/2000/svg">
                <path d="M18 6C17.39 6 16.83 5.65 16.55 5.11L15.83 3.66C15.37 2.75 14.17 2 13.15 2H10.86C9.83005 2 8.63005 2.75 8.17005 3.66L7.45005 5.11C7.17004 5.65 6.61005 6 6.00005 6C3.83005 6 2.11005 7.83 2.25005 9.99L2.77005 18.25C2.89005 20.31 4.00005 22 6.76005 22H17.24C20 22 21.1 20.31 21.23 18.25L21.75 9.99C21.89 7.83 20.17 6 18 6ZM10.5 7.25H13.5C13.91 7.25 14.25 7.59 14.25 8C14.25 8.41 13.91 8.75 13.5 8.75H10.5C10.09 8.75 9.75005 8.41 9.75005 8C9.75005 7.59 10.09 7.25 10.5 7.25ZM12 18.12C10.14 18.12 8.62005 16.61 8.62005 14.74C8.62005 12.87 10.13 11.36 12 11.36C13.87 11.36 15.38 12.87 15.38 14.74C15.38 16.61 13.86 18.12 12 18.12Z"
                    fill="white" />
                </svg>
            </button>
          </li>
        </ul>
      </section>

    </section>
  </main>

  <script>

  
    // Read csrftoken from cookie for Django's CSRF protection; Without it, “403 Forbidden”
    function getCsrfToken() {
      const m = document.cookie.match(/(?:^|;\s*)csrftoken=([^;]+)/);
      return m ? decodeURIComponent(m[1]) : null;
    }

    //Builds standard headers for all fetch() API calls
    function buildAuthHeaders(extra = {}) {
      const jwt  = localStorage.getItem('access_token');
      const csrf = getCsrfToken();
      const headers = { 'Content-Type': 'application/json', ...extra };
      if (jwt)  headers['Authorization'] = `Bearer ${jwt}`;
      if (csrf) headers['X-CSRFToken']   = csrf;      // important for PUT/POST with session
      return headers;
    }
    //Extracts the username from the current URL, e.g. /authors/makima/ --> "makiam".Used to know whose profile to fetch.
    function getUsernameFromPath() {
      const m = location.pathname.match(/\/authors\/([^\/]+)\/?$/);
      return m ? decodeURIComponent(m[1]) : null;
    }

    const API = {
      getProfile(username) {    //get author info
        return fetch(`/api/authors/${encodeURIComponent(username)}/json/`, {
          headers: buildAuthHeaders(),
          credentials: 'same-origin'
        });
      },
      updateProfile(username, body) {    // update author info
        return fetch(`/api/authors/${encodeURIComponent(username)}/json/`, {
          method: 'PUT',
          headers: buildAuthHeaders(),
          body: JSON.stringify(body),
          credentials: 'same-origin'
        });
      }
    };

    //upload avatar
    const uploadBtn   = document.getElementById('uploadBtn');
    const avatarInput = document.getElementById('avatarInput');
    const mainAvatar  = document.getElementById('mainAvatar');
    let selectedAvatarFile = null;  // keep selected file for later upload

    if (uploadBtn && avatarInput && mainAvatar) {
      uploadBtn.addEventListener('click', () => avatarInput.click());
      avatarInput.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        selectedAvatarFile = file;           // remember for Save
        const reader = new FileReader();
        reader.onload = () => { mainAvatar.src = reader.result; }; // instant preview only
        reader.readAsDataURL(file);
        // Do not upload here; upload happens on Save
      });
    }

    //  preloads an image and only replaces the avatar once the new image is confirmed to load correctly
    function swapAvatar(imgEl, url) {
      if (!imgEl || !url) return;
      const tmp = new Image();
      tmp.onload = () => { imgEl.src = url; };
      tmp.src = url;
    }

    // Fetch and display author profile info from backend API
    async function getProfile() {
      const usernameInUrl = getUsernameFromPath();
      if (!usernameInUrl) {
        console.error('Cannot parse username from URL.');
        return;     //If username cannot be parsed from URL, stop and log error
      }

      try {
        const r = await API.getProfile(usernameInUrl);    //get author profile

        if (r.status === 401){
          window.location = '/authors/auth/';  //back to auth page if 401
          return;
        }
        if (!r.ok) {
          const errText = await r.text();
          console.error('Failed to load profile:', r.status, errText);
          alert('Failed to load profile details.');
          return;
        }

        const d = await r.json();  //parse author profile to Json

        document.getElementById('username').value = d.username || usernameInUrl || '';
        document.getElementById('profile-name').textContent = d.display_name || d.username || usernameInUrl || '';
        document.getElementById('display_name').value = d.display_name || d.username || usernameInUrl || '';
        document.getElementById('github_url').value = d.github_url || '';
        document.getElementById('bio').value = d.bio || '';

        const main = document.getElementById('mainAvatar');
        const small = document.getElementById('smallAvatar');
        const fallbackSrc = main?.dataset?.fallback || "{% static 'authors/avatar1.jpg' %}";

        if (d.image) {
          const bust = d.image + '?t=' + Date.now();  // prevent stale cache
          swapAvatar(main, bust);
          if (small) {
            swapAvatar(small, bust)
          };
        } else {
          // no uploaded avatar -> use static fallback for both
          swapAvatar(main, fallbackSrc);
          if (small) {
            swapAvatar(small, fallbackSrc)
          };
        }
      } catch (err) {
        console.error(err);
        alert('Network error. Please try again.');
      }
    }
    
    //handle profile save(update info & avatar uploading)
    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      // Extract username from URL to know which author profile to update( /api/authors/<username>/json/)
      const usernameInUrl = getUsernameFromPath();
      if (!usernameInUrl) {
        alert('Invalid profile URL.');
        return;
      }
      const body = {
        display_name: document.getElementById('display_name').value,
        github_url: document.getElementById('github_url').value,
        bio: document.getElementById('bio').value
      };

      const saveBtn = document.getElementById('saveBtn');
      const prevText = saveBtn.textContent;
      saveBtn.disabled = true; //Prevent double submission
      
      try {
        //Send PUT request to update profile info
        const r = await API.updateProfile(usernameInUrl, body);   

        saveBtn.disabled = false; //enable after response
        saveBtn.textContent = prevText;

        if (r.status === 401) {
          window.location = '/authors/auth/';
          return;
        }
        if (!r.ok) {
          const errText = await r.text();
          console.error('Update failed:', r.status, errText);
          alert('Failed to save. Please try again.');
          return;
        }

        // If an avatar file was selected, upload it after profile update
        if (selectedAvatarFile) {
          const fd = new FormData();
          fd.append("image", selectedAvatarFile);
          const up = await fetch(`/api/authors/${encodeURIComponent(usernameInUrl)}/avatar/`, {
            method: "POST",
            body: fd,
            credentials: "same-origin"
          });
          
          if (!up.ok) {
            const t = await up.text();
            console.error("Avatar upload failed", up.status, t);
            alert("Avatar upload failed");
            return;    // stop here; don't overwrite preview with old data
          }
          const data = await up.json();
          const newUrl = data.image + "?t=" + Date.now();
          swapAvatar(document.getElementById('mainAvatar'), newUrl);
          const smallAvatar = document.getElementById('smallAvatar');
          if (smallAvatar) swapAvatar(smallAvatar, newUrl);
          selectedAvatarFile = null;   // clear after successful upload
        }
        
        await getProfile();
      } catch (err) {
        saveBtn.disabled = false;
        saveBtn.textContent = prevText;
        console.error(err);
        alert('Network error. Please try again.');
      }
    });

   getProfile();

  </script>
  
</body>
</html>
