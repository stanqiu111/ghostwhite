<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px;
        background-color: #f5f5f5;
        border-radius: 8px;
        margin-bottom: 30px;
      }
      h1 {
        margin: 0;
      }
      .logout-btn {
        background-color: #dc3545;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
      }
      .logout-btn:hover {
        background-color: #c82333;
      }
      .content {
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Welcome Home!</h1>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="content">
      <h2>You're logged in!</h2>
      <p>This is your home page.</p>
      <button onclick="navigateToDetail()">Test detail page</button>
    </div>

    <script>
      function logout() {
        // Clear JWT tokens from localStorage
        localStorage.removeItem("access_token");
        localStorage.removeItem("refresh_token");
        localStorage.removeItem("user_data");

        window.location.href = "/api/authors/logout/";
      }

      function navigateToDetail() {
        window.location.href =
          "/api/entries/67c6fa42-b6cd-4b7e-8dea-7543eb8fe3b1/view/";
      }
    </script>
  </body>
</html>
