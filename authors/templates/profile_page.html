<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Profile Setting Page</title>
  <link rel="stylesheet" href="{% static 'authors/profile.css' %}">
</head>
<body>

  <nav class="topbar">
    <div class="brand">
        <span class="brand-avatar"></span>
        <span class="brand-name">Éthéré</span>
    </div>
    <form class="search" role="search">

                </svg>
            </button>
    </form>    
    <ul class="nav-toolbar">
        <li><button class="primary">+ Create</button></li>
        <li>
          <button class="bell icon">
            <svg width="26" height="26" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M13 6.97665V10.5842" stroke="#292D32" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round"/>
              <path d="M22.3059 16.4342C23.0967 17.7558 22.4684 19.4675 21.0059 19.955C15.8275 21.6775 10.2267 21.6775 5.04838 19.955C3.48838 19.435 2.89255 17.8533 3.74838 16.4342L5.12422 14.1375C5.50338 13.5092 5.80672 12.3933 5.80672 11.6675V9.39249C5.80672 5.39499 9.03505 2.16666 13.0217 2.16666C16.9867 2.16666 20.2367 5.41666 20.2367 9.38166V11.6567C20.2367 11.8517 20.2584 12.0683 20.2909 12.2958" stroke="#292D32" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round"/>

              <path d="M21.6667 3.15151C21.6667 4.45691 20.6085 5.51514 19.3031 5.51514C17.9977 5.51514 16.9395 4.45691 16.9395 3.15151C16.9395 1.84611 17.9977 0.787872 19.3031 0.787872C20.6085 0.787872 21.6667 1.84611 21.6667 3.15151Z" fill="#C01A1A"/>
            </svg>

          </button>
        </li>
        <li><img class="avatar sm" id="smallAvatar" alt="User Avatar"></li>
    </ul>
  </nav>


  <main class="layout">
    <section class="profile-card">
      <figure class="mainAvatar">
        <img class="avatar lg" id="mainAvatar" alt="User Avatar">    
      </figure>
      

      <section class="profile-stats">
        <h2 class = "profile-name" id="profile-name">Reze</h2>
        <ul class="stats">
          <li id="statEntries">200<br>Entries</li>
          <li id="statFollowers">100<br>Followers</li>
          <li id="statFollowing">105<br>Following</li>
        </ul>
      </section>

      <section class="friends">
        <h3>Friends</h3>
        <ul class="friend-grid" id="friendsGrid"></ul>
      </section>
    </section>


    <section class="profile-detail">
      <h2>Profile Details</h2>

      <form id="profileForm">
        <section class="profile-fields">
          <label>Username
            <input id="username" name="username" disabled autocomplete="username">
          </label>

          <label>Display name
            <input id="display_name" name="display_name" required>
          </label>

          <label>Github URL
            <input id="github_url" name="github_url" placeholder="https://github.com/username">
          </label>

          <label>Bio
            <textarea id="bio" name="bio"></textarea>
          </label>
        </section>

        <button id="saveBtn" class="primary" type="submit">Save</button>
      </form>

      <hr>

      <section class="entries">
        <h3>Entries</h3>
        <ul class="gallery" id="entriesGallery">
          <li class="upload-tile no-image">
            <button class="upload-btn" type="button">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                xmlns="http://www.w3.org/2000/svg">
                <path d="M18 6C17.39 6 16.83 5.65 16.55 5.11L15.83 3.66C15.37 2.75 14.17 2 13.15 2H10.86C9.83005 2 8.63005 2.75 8.17005 3.66L7.45005 5.11C7.17004 5.65 6.61005 6 6.00005 6C3.83005 6 2.11005 7.83 2.25005 9.99L2.77005 18.25C2.89005 20.31 4.00005 22 6.76005 22H17.24C20 22 21.1 20.31 21.23 18.25L21.75 9.99C21.89 7.83 20.17 6 18 6ZM10.5 7.25H13.5C13.91 7.25 14.25 7.59 14.25 8C14.25 8.41 13.91 8.75 13.5 8.75H10.5C10.09 8.75 9.75005 8.41 9.75005 8C9.75005 7.59 10.09 7.25 10.5 7.25ZM12 18.12C10.14 18.12 8.62005 16.61 8.62005 14.74C8.62005 12.87 10.13 11.36 12 11.36C13.87 11.36 15.38 12.87 15.38 14.74C15.38 16.61 13.86 18.12 12 18.12Z"
                    fill="white" />
                </svg>
            </button>
          </li>
        </ul>
      </section>

    </section>
  </main>

  <script>

    function buildAuthHeaders(extra = {}) {
      const token = localStorage.getItem('access');
      const headers = { ...extra };
      if (token) headers['Authorization'] = `Bearer ${token}`;
      return headers;
    }

    function getProfile(){
        fetch('/api/authors/author_profile/', { 
            headers: buildAuthHeaders()
         })
        .then(r => r.json()).then(d => {
          document.getElementById('username').value = d.username || '';
          if (d.display_name) {
            document.getElementById('profile-name').textContent = d.display_name;
          }
          document.getElementById('display_name').value = d.display_name || '';
          document.getElementById('github_url').value = d.github_url || '';
          document.getElementById('bio').value = d.bio || '';
          document.getElementById('mainAvatar').src = d.image || '';
          document.getElementById('smallAvatar').src = d.image || '';
        });
    }
    document.addEventListener('input', (e) => {
      if (e.target && e.target.id === 'display_name') {
        const v = e.target.value.trim();
        if (v) document.getElementById('profile-name').textContent = v;
      }
    });

      document.getElementById('profileForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const body = {
        display_name: document.getElementById('display_name').value,
        github_url: document.getElementById('github_url').value,
        bio: document.getElementById('bio').value
      };
      document.getElementById('saveBtn').disabled = true;
      fetch('/api/authors/author_profile/', {
        method: 'PUT',
        headers: buildAuthHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify(body)
      }).then(async r => {
        document.getElementById('saveBtn').disabled = false;
        if (r.ok) getProfile();
      });
    });
    function renderGallery(images = []) {
        const gallery = document.getElementById('entriesGallery');
        const uploadTile = document.querySelector('.upload-tile');
        
        gallery.innerHTML = ''; 
        images.slice(0, 5).forEach(url => {
            const li = document.createElement('li');
            li.innerHTML = `<img src="${url}" alt="entry">`;
            gallery.appendChild(li);
        });
        gallery.appendChild(uploadTile); 
        }

    getProfile();
  </script>
  
</body>
</html>
