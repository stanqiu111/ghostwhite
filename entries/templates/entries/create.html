{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Create Entry (HTML → DRF)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:24px}
    .wrap{max-width:800px;margin:0 auto}
    .card{border:1px solid #e5e7eb;border-radius:12px;padding:16px}
    textarea,select{width:100%;padding:8px;border:1px solid #e5e7eb;border-radius:8px}
    button{margin-top:10px;padding:8px 12px;border:1px solid #e5e7eb;border-radius:8px;background:#fff;cursor:pointer}
    .meta{color:#6b7280;font-size:14px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h2>Create Entry</h2>
    <form id="create-form">
      {% csrf_token %}
      <label>Content</label>
      <textarea name="content" rows="6" required></textarea>

      <label style="margin-top:10px;">Content Type</label>
      <select name="content_type">
        <option value="plain_text">Plain Text</option>
        <option value="markdown">Markdown</option>
      </select>

      <label style="margin-top:10px;">Visibility</label>
      <select name="visibility">
        <option value="public">Public</option>
        <option value="unlisted">Unlisted</option>
        <option value="friends_only">Friends Only</option>
      </select>

      <button type="submit">Create</button>
      <div id="msg" class="meta" style="margin-top:8px;"></div>
    </form>
  </div>
</div>

<script>
  function getCookie(name){
    const v = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
    return v ? v.pop() : '';
  }
  const csrftoken = getCookie('csrftoken');

  document.getElementById('create-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const f = e.target;
    const payload = {
      content: f.content.value,
      content_type: f.content_type.value,
      visibility: f.visibility.value
      // image 若要上传，用单独的表单/接口；此处演示文本创建
    };
    document.getElementById('msg').textContent = 'Creating...';

    const res = await fetch("{% url 'entries:entry-create' %}", {
      method: 'POST',
      headers: {
        'Content-Type':'application/json',
        'X-CSRFToken': csrftoken
      },
      body: JSON.stringify(payload),
      credentials: 'same-origin'
    });

    if (!res.ok){
      const txt = await res.text();
      document.getElementById('msg').textContent = 'Failed: ' + res.status + ' ' + txt;
      return;
    }
    const data = await res.json();   // serializer 返回新建 entry
    // data.id 是 UUID
    window.location.href = `/entries/${data.id}/page/`;
  });
</script>
</body>
</html>
