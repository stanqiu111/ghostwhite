{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Create Entry</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <style>
    :root{
      --bg:#f8f8fa; --card:#fff; --ink:#0f172a; --muted:#6b7280; --line:#e5e7eb;
      --ink-weak:#1f2937; --brand:#111827; --brand-ink:#fff;
      --pad:16px; --topbar-h:64px; --maxw:1280px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,Segoe UI,Roboto,Helvetica,Arial}

    /* top bar */
    .topbar{position:sticky;top:0;z-index:10;height:var(--topbar-h);background:#fff;border-bottom:1px solid var(--line)}
    .topbar .inner{max-width:var(--maxw);height:100%;margin:0 auto;padding:10px var(--pad);display:flex;gap:12px;align-items:center}
    .avatar{width:36px;height:36px;border-radius:50%;background:#111}
    .spacer{flex:1}

    /* page */
    .container{max-width:var(--maxw);margin:0 auto;padding:var(--pad);min-height:calc(100vh - var(--topbar-h))}
    .row{height:calc(100vh - var(--topbar-h) - 2*var(--pad));display:grid;grid-template-columns:1fr;gap:var(--pad);align-items:stretch}
    @media (min-width:980px){ .row{grid-template-columns:2fr 1fr} }

    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.03);height:100%;display:flex;flex-direction:column;min-height:0}
    .card .head{display:flex;gap:8px;align-items:center;padding:calc(var(--pad)*0.6);border-bottom:1px solid var(--line)}
    .body{padding:var(--pad);flex:1;display:flex;flex-direction:column;min-height:0}

    .pill{border-radius:12px;padding:8px 14px;border:1px solid var(--line);background:#f4f4f6;color:var(--ink-weak);font-weight:600;font-size:14px;display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;}
    .pill svg{
    flex-shrink:0;
  }
    .pill.active{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
    .grow{flex:1}
    .select{appearance:none;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff}

    textarea{width:100%;flex:1;min-height:0;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .preview{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff;flex:1;min-height:0;overflow:auto}

    /* preview prose */
    .prose h1{font-size:1.8rem;margin:0.8em 0 .4em}
    .prose h2{font-size:1.5rem;margin:0.8em 0 .4em}
    .prose h3{font-size:1.25rem;margin:0.8em 0 .4em}
    .prose p,.prose ul,.prose ol{margin:.6em 0}
    .prose code{background:#f3f4f6;padding:.15em .35em;border-radius:6px}
    .prose pre{background:#0b1020;color:#eaeaff;padding:12px;border-radius:12px;overflow:auto}

    /* single photo picker */
    .photo-wrap{display:flex;flex-direction:column;gap:12px}
    .thumb{position:relative;width:180px;height:180px;border:1px dashed var(--line);border-radius:16px;background:#fafafa;display:flex;align-items:center;justify-content:center;color:var(--muted)}
    .thumb img{width:100%;height:100%;object-fit:cover;border-radius:16px}
    .thumb .x{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.7);color:#fff;border:0;border-radius:20px;padding:2px 6px;cursor:pointer}
    .add{display:flex;align-items:center;justify-content:center;width:180px;height:180px;border:2px dashed var(--line);border-radius:16px;background:#fafafa;color:var(--muted);cursor:pointer}

    .btn{width:100%;padding:14px 18px;border-radius:12px;border:0;background:var(--brand);color:#fff;font-weight:700;cursor:pointer}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    .note{margin-top:10px;color:var(--muted);font-size:.95rem}
  </style>
  <script src="{% static 'js/marked.min.js' %}"></script>
</head>

  <div class="container">
    <div class="row">
      <!-- Editor -->

          <button id="tabPreview" class="pill">Preview</button>
          <div class="grow"></div>

<script src="{% static 'js/common.js' %}"></script>
<script>

/* ----------- MODE: create or edit ----------- */
const ENTRY_ID = '{{ entry_id|default:"" }}'; // we need id passed from django to know if we are editing or creating
const IS_EDITING = !!ENTRY_ID;

/* ----------- state ----------- */
const state = {
  tab: 'edit',
  contentType: 'text/markdown',
  visibility: 'public',
  image: null,      // single File or null
  existingImageUrl: null, 
  posting: false,
  title: '',  
};

/* ----------- els ----------- */
const tabEdit = document.getElementById('tabEdit');
const tabPreview = document.getElementById('tabPreview');
const contentTypeSel = document.getElementById('contentType');
const contentArea = document.getElementById('contentArea');
const preview = document.getElementById('preview');
const titleInput = document.getElementById('titleInput');

const visButtons = Array.from(document.querySelectorAll('[data-visibility]'));
const photoSlot = document.getElementById('photoSlot');
const fileInput = document.getElementById('fileInput');

const postBtn = document.getElementById('postBtn');
const note = document.getElementById('note');

if (IS_EDITING) {
  postBtn.textContent = 'Update';
  document.title = 'Edit Entry';
}

// if we are creating, we will set dummy text
if (!IS_EDITING) {
  contentArea.value = `# Hello!

Upload a single image with this entry. **Markdown** supported.
`;
}

/* ----------- tabs ----------- */
tabEdit.addEventListener('click', () => setTab('edit'));
tabPreview.addEventListener('click', () => setTab('preview'));

function setTab(t){
  state.tab = t;
  tabEdit.classList.toggle('active', t==='edit');
  tabPreview.classList.toggle('active', t==='preview');
  contentArea.style.display = t==='edit' ? 'block' : 'none';
  preview.style.display = t==='preview' ? 'block' : 'none';
  if (t==='preview') renderPreview();
}

contentTypeSel.addEventListener('change', e => {
  state.contentType = e.target.value;
  if (state.tab==='preview') renderPreview();
});

function renderPreview(){
  const text = contentArea.value || '';
  if (state.contentType === 'text/markdown') {
    marked.setOptions({ breaks:true, gfm:true });
    preview.innerHTML = marked.parse(text);
  } else {
    preview.textContent = text;
  }
}

/* ----------- privacy ----------- */
visButtons.forEach(btn=>{
  btn.addEventListener('click', ()=>{
    state.visibility = btn.dataset.visibility;
    visButtons.forEach(b=>b.classList.toggle('active', b===btn));
  });
});

/* ----------- single image picker ----------- */
photoSlot.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', () => {
  const file = fileInput.files && fileInput.files[0] ? fileInput.files[0] : null;
  state.image = file;
  renderPhoto();
  fileInput.value = ''; // allow picking the same file again if wanted
});

function renderPhoto(){
  if (!state.image && !state.existingImageUrl) {
    photoSlot.className = 'add';
    photoSlot.textContent = 'Add photo';
    return;
  }
  // Show new image if selected, otherwise show existing
  const url = state.image ? URL.createObjectURL(state.image) : state.existingImageUrl;
  photoSlot.className = 'thumb';
  photoSlot.innerHTML = `<img src="${url}" alt="preview"><button class="x" title="Remove">✕</button>`;
  photoSlot.querySelector('.x').addEventListener('click', ()=>{
    state.image = null;
    state.existingImageUrl = null;
    renderPhoto();
  });
}

/* ----------- load existing entry if editing ----------- */
async function loadEntry() {
  if (!IS_EDITING) return;
  
  try {
    const res = await fetch(`/api/entries/${ENTRY_ID}/`, {
      headers: getHeaders(),
    });
    if (!res.ok) throw new Error('Failed to load entry');
    
    const entry = await res.json();
    state.title = entry.title || '';
    if (titleInput) titleInput.value = state.title;
    
    // Populate form
    const ct = (entry.content_type || '').toLowerCase();
    const isImage = ct.startsWith('image/') || ct.includes('base64');

    if (isImage) {
      // Do not load raw base64 into the editor
      contentArea.value = '';
      // Keep the editor in a safe plain text mode
      state.contentType = 'text/plain';
    } else {
      contentArea.value = entry.content || '';
      state.contentType = entry.content_type || 'text/markdown';
    }
    contentTypeSel.value = state.contentType;
    state.visibility = entry.visibility || 'public';
    
    // Set active visibility button
    visButtons.forEach(btn => {
      btn.classList.toggle('active', btn.dataset.visibility === state.visibility);
    });
    
    // Show existing image (prefer direct URL if provided)
    if (entry.image || entry.image_url) {
      state.existingImageUrl = entry.image_url || entry.image;
      renderPhoto();
    }
  } catch (err) {
    alert('Failed to load entry: ' + err.message);
  }
}

/* ----------- submit ----------- */
postBtn.addEventListener('click', async ()=>{
  if (state.posting) return;
  state.posting = true;
  postBtn.disabled = true;
  note.textContent = '';

  try{
    const fd = new FormData();
    fd.append('content', contentArea.value || '');
    fd.append('content_type', state.contentType);
    fd.append('visibility', state.visibility);
    fd.append('title', (titleInput.value || '').trim());   

    if (state.image) {
      fd.append('image', state.image);
    }
    
    const url = IS_EDITING ? `/api/entries/${ENTRY_ID}/update/` : '/api/entries/create/';
    const method = IS_EDITING ? 'PUT' : 'POST';

    const headers = getHeadersWithNoContentType();
    headers['X-CSRFToken'] = getCSRFToken();
    headers['X-Requested-With'] = 'XMLHttpRequest';
    
    const res = await fetch(url, {
      method: method,
      headers: headers,
      credentials: 'same-origin',
      body: fd
    });

    let data = null;
    try { data = await res.json(); } catch {}
    if (!res.ok) {
      throw new Error(data?.detail || `Failed (${res.status})`);
    }

    note.textContent = IS_EDITING ? '✅ Updated!' : '✅ Posted!';
    // Redirect to entry page after success
    setTimeout(() => {
      function extractEntrySerialFromFqid(fqid) {
        if (!fqid) return fqid;
        if (typeof fqid !== 'string') fqid = String(fqid);
        if (fqid.includes('/entries/')) {
          return fqid.split('/entries/')[1].split('/')[0].split('?')[0];
        }
        return fqid;
      }
      const entrySerial = extractEntrySerialFromFqid(data.id);
      window.location.href = `/entries/${entrySerial}/`;
    }, 800);
  }catch(err){
    note.textContent = `⚠️ ${err.message || err}`;
  }finally{
    state.posting = false;
    postBtn.disabled = false;
  }
});
const homeBtn = document.getElementById('homeBtn');
if (homeBtn) {
  homeBtn.addEventListener('click', (e) => {
    e.preventDefault();
    if (confirm("Are you sure you want to leave? Your unsaved post will be lost.")) {
      window.location.href = homeBtn.href;
    }
  });
}
loadEntry();
</script>
