<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post Detail</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 50px auto;
        padding: 20px;
        background-color: #f9f9f9;
      }
      .post-box {
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .post-meta {
        color: #666;
        font-size: 14px;
        margin-bottom: 20px;
      }
      .post-content {
        line-height: 1.6;
        margin: 20px 0;
      }
      a {
        color: #007bff;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <a href="/">← Back</a>

    <div class="post-box">
      <h1>{{ entry.author.username }}'s Post</h1>

      <div class="post-meta">
        Posted on {{ entry.created_at|date:"F d, Y" }} | Visibility: {{
        entry.get_visibility_display }}
      </div>

      {% if entry.image %}
      <img
        src="{{ entry.image.url }}"
        alt="Post image"
        style="max-width: 100%; border-radius: 4px"
      />
      {% endif %}

      <div class="post-content">{{ entry.content }}</div>

      <hr />
      <small style="color: #999">Post ID: {{ entry.id }}</small>
    </div>
  </body>
</html>
