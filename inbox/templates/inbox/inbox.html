{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inbox - ÉTHÉRÉ</title>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
  <div class="header">
    <div class="header-content">
      <div class="logo" onclick="window.location.href='/home/';">ÉTHÉRÉ</div>
      <!-- 필요하면 여기 상단바 복붙 -->
    </div>
  </div>

  <div class="main-container">
    <div class="middle-column">
      <div class="card">
        <div class="card-title">Inbox</div>
        <div id="notifList" class="list">
          <div class="empty-state">Loading…</div>
        </div>
      </div>
    </div>
  </div>

  <script src="{% static 'js/api.js' %}"></script>
  <script>
    function esc(s='') {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function loadAllNotifications() {
      const list = document.getElementById('notifList');
      try {
        list.innerHTML = '<div class="empty-state">Loading…</div>';
        const res = await api('/inbox/notifications/?limit=200', { method: 'GET' });
        const items = res.items || [];

        if (!items.length) {
          list.innerHTML = '<div class="empty-state">No notifications</div>';
          return;
        }

        list.innerHTML = '';
        items.forEach(n => {
          const row = document.createElement('div');
          row.className = 'suggestion-item';
          row.style.borderBottom = '1px solid #f0f0f0';

          const left = document.createElement('div');
          left.className = 'suggestion-info';
          const actorImg = (n.actor && n.actor.image) ? n.actor.image : '{% static "images/default_pfp.png" %}';
          const actorName = (n.actor && n.actor.display_name) ? n.actor.display_name : 'Someone';

          left.innerHTML = `
            <div class="suggestion-avatar">
              <img src="${actorImg}" alt="${esc(actorName)}"
                   style="width:100%;height:100%;border-radius:50%;object-fit:cover;">
            </div>
            <div>
              <div class="suggestion-name">${esc(actorName)}</div>
              <div style="font-size:12px;color:#6b7280;">
                ${esc(n.verb)} • ${new Date(n.created).toLocaleString()}
              </div>
            </div>
          `;

          const right = document.createElement('div');
          right.style.display = 'flex';
          right.style.gap = '8px';
          const btn = document.createElement('button');
          btn.className = 'follow-btn';
          btn.textContent = 'View';
          btn.onclick = () => {
            if (n.object_id) window.location.href = `/entries/${n.object_id}/`;
            else if (n.object_url) window.open(n.object_url, '_blank', 'noopener');
          };
          right.appendChild(btn);

          row.appendChild(left);
          row.appendChild(right);
          list.appendChild(row);
        });
      } catch (e) {
        list.innerHTML = `<div class="empty-state">Failed to load. ${e.message || e}</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', loadAllNotifications);
  </script>
</body>
</html>{% load static %}
