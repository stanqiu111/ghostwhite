{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Inbox</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="{% static 'images/favicon.svg' %}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{% static 'css/main.css' %}?v=6">
  <link rel="stylesheet" href="{% static 'inbox/inbox.css' %}?v=1">
  <script src="{% static 'js/marked.min.js' %}"></script>
  <link rel="stylesheet" href="{% static 'css/theme.css' %}?v=6">
  <script src="{% static 'js/common.js' %}?v=6"></script>
</head>
<body class="inbox-page">
  <!-- Top bar (home/create랑 동일) -->
  {% include "partials/header.html" %}

  <!-- 메인 컨테이너: 전체 알림 리스트 -->
  <div class="container">
    <section class="card">
      <div class="card-head">
        <h1>Inbox</h1>
        <span id="notifCountPill" class="pill">0 notifications</span>
      </div>
      <div class="card-body" id="notifList">
        <div class="empty-state">Loading…</div>
      </div>
    </section>
  </div>

  <script src="{% static 'js/api.js' %}?v=5"></script>
  <script>
    // home / create 에서 쓰는 헬퍼 그대로
    async function api(path, opts={}) {
      // apiFetch adds CSRF + bearer + same-origin cookies and auto-refreshes
      // the access token on a 401, so calls survive token expiry.
      const res = await apiFetch(`/api${path}`, opts);
      let data = null; try{ data = await res.json(); }catch{}
      if (!res.ok) throw new Error(data?.detail || `${res.status} ${res.statusText}`);
      return data;
    }

    function esc(s='') {
      return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    function navigateToEntry(id) {
      if (!id) return;
      function extractEntrySerialFromFqid(fqid) {
        if (!fqid) return fqid;
        if (typeof fqid !== 'string') fqid = String(fqid);
        if (fqid.includes('/entries/')) {
          return fqid.split('/entries/')[1].split('/')[0].split('?')[0];
        }
        return fqid;
      }
      const entrySerial = extractEntrySerialFromFqid(id);
      window.location.href = `/entries/${entrySerial}/`;
    }

    async function loadAllNotifications() {
      const list = document.getElementById('notifList');
      const pill = document.getElementById('notifCountPill');

      try {
        list.innerHTML = '<div class="empty-state">Loading…</div>';

        // 홈 카드에서는 limit=5, 여기서는 넉넉하게 예: 200
        const res = await api('/inbox/notifications/?limit=200', { method:'GET' });
        const items = res.items || [];

        const countText = items.length === 1
          ? '1 notification'
          : `${items.length} notifications`;
        pill.textContent = countText;

        if (!items.length) {
          list.innerHTML = '<div class="empty-state">No notifications yet.</div>';
          return;
        }

        list.innerHTML = '';

        items.forEach(n => {
          const row = document.createElement('div');
          row.className = 'notif-item';

          const main = document.createElement('div');
          main.className = 'notif-main';

          const avatarDiv = document.createElement('div');
          avatarDiv.className = 'notif-avatar';
          const imgSrc = (n.actor && n.actor.image) ? n.actor.image : '{% static "images/default_pfp.png" %}';
          avatarDiv.innerHTML = `<img src="${imgSrc}" alt="${esc(n.actor?.display_name || 'User')}">`;

          const textWrap = document.createElement('div');
          textWrap.className = 'notif-text';

          const actorName = esc(n.actor?.display_name || 'Someone');
          const verb = esc(n.verb || '');
          const created = n.created ? new Date(n.created).toLocaleString() : '';

          let inner = `
            <div class="notif-actor">${actorName}</div>
            <div class="notif-verb">${verb}</div>
            `;

            // comment 알림일 경우 → verb 바로 아래 미리보기 표시
        if (n.type === 'comment' && n.comment_preview) {
            inner += `
                <div class="notif-preview">
                “${esc(n.comment_preview)}”
                </div>
            `;
            }

            // 마지막 줄 = created time
        inner += `
            <div class="notif-meta">${created}</div>
            `;

        textWrap.innerHTML = inner;

          main.appendChild(avatarDiv);
          main.appendChild(textWrap);

          const actions = document.createElement('div');
          actions.className = 'notif-actions';
          const btn = document.createElement('button');
          btn.className = 'btn-view';
          btn.textContent = 'View';
          btn.onclick = () => {
            if (n.object_id) {
              navigateToEntry(n.object_id);
            } else if (n.object_url) {
              window.location.href = n.object_url;
            }
          };
          actions.appendChild(btn);

          row.appendChild(main);
          row.appendChild(actions);
          list.appendChild(row);
        });

      } catch (e) {
        console.error(e);
        list.innerHTML = `<div class="empty-state">Failed to load notifications. ${esc(e.message || e)}</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', loadAllNotifications);
  </script>
</body>
</html>
