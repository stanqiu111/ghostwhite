{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Inbox</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <style>
    :root{
      --bg:#f8f8fa; --card:#fff; --ink:#0f172a; --muted:#6b7280; --line:#e5e7eb;
      --ink-weak:#1f2937; --brand:#111827; --brand-ink:#fff;
      --pad:16px; --topbar-h:64px; --maxw:1280px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,Segoe UI,Roboto,Helvetica,Arial}

    /* top bar (home/create랑 동일) */
    .header{
      position:sticky;top:0;z-index:10;
      background:#fff;border-bottom:1px solid var(--line);
    }
    .header-content{
      max-width:var(--maxw);margin:0 auto;
      height:64px;padding:10px var(--pad);
      display:flex;align-items:center;gap:12px;
    }
    .logo{font-weight:800;font-size:20px;cursor:pointer}
    .search-bar{
      flex:1;max-width:420px;
      display:flex;align-items:center;
      border-radius:999px;border:1px solid var(--line);
      padding:0 10px;background:#f9fafb;
    }
    .search-input{
      flex:1;border:0;background:transparent;
      padding:8px 6px;font-size:14px;outline:none;
    }
    .search-clear{border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .header-actions{display:flex;align-items:center;gap:8px}
    .header-btn{
      border:0;background:transparent;cursor:pointer;
      padding:6px;border-radius:999px;
    }
    .header-btn:hover{background:#f3f4f6}
    .logout-btn{
      border:1px solid var(--line);
      padding:6px 14px;border-radius:999px;
      background:#fff;font-size:14px;cursor:pointer;
    }

    /* page layout */
    .container{
      max-width:var(--maxw);
      margin:0 auto;
      padding:var(--pad);
      min-height:calc(100vh - var(--topbar-h));
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:16px;
      box-shadow:0 1px 2px rgba(0,0,0,.03);
      padding:0;
      display:flex;
      flex-direction:column;
      min-height:0;
    }
    .card-head{
      padding:12px var(--pad);
      border-bottom:1px solid var(--line);
      display:flex;align-items:center;gap:8px;
    }
    .card-head h1{
      font-size:18px;margin:0;font-weight:700;
    }
    .pill{
      margin-left:auto;
      border-radius:999px;
      padding:6px 12px;
      border:1px solid var(--line);
      background:#f4f4f6;
      color:var(--muted);
      font-size:13px;
      font-weight:500;
    }
    .card-body{
      padding:var(--pad);
      display:flex;
      flex-direction:column;
      gap:8px;
      min-height:0;
    }

    .empty-state{
      text-align:center;
      padding:40px 0;
      color:var(--muted);
      font-size:14px;
    }

    /* notification rows – home Inbox 카드 스타일이랑 비슷하게 */
    .notif-item{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      padding:10px 0;
      border-bottom:1px solid var(--line);
    }
    .notif-item:last-child{border-bottom:none;}

    .notif-main{
      display:flex;
      gap:12px;
      align-items:flex-start;
      flex:1;
      min-width:0;
    }
    .notif-avatar{
      width:40px;height:40px;border-radius:50%;
      background:#f3f4f6;
      overflow:hidden;
      flex-shrink:0;
    }
    .notif-avatar img{
      width:100%;height:100%;object-fit:cover;border-radius:50%;
    }
    .notif-text{
      display:flex;flex-direction:column;gap:2px;
      min-width:0;
    }
    .notif-actor{
      font-weight:600;font-size:14px;color:var(--ink-weak);
    }
    .notif-verb{
      font-size:14px;color:var(--ink);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:420px;
    }
    .notif-meta{
      font-size:12px;color:var(--muted);
    }

    .notif-actions{
      display:flex;align-items:center;gap:8px;
      flex-shrink:0;
    }
    .btn-view{
      border-radius:999px;
      padding:6px 12px;
      border:0;
      background:var(--brand);
      color:#fff;
      font-size:13px;
      font-weight:500;
      cursor:pointer;
    }
    .btn-view:hover{opacity:.9}
  </style>
  <script src="{% static 'js/marked.min.js' %}"></script>
</head>
<body>
  <!-- Top bar (home/create랑 동일) -->
  <div class="header">
      <div class="header-content">
        <div class="logo" onclick="navigateToHome()">ÉTHÉRÉ</div>
        <div class="search-bar">

          <button class="search-clear">

          </button>
          <button class="header-btn" title="Inbox"
            onclick="window.location.href='/inbox/';">
            <svg

        </div>
      </div>
    </div>

  <!-- 메인 컨테이너: 전체 알림 리스트 -->
  <div class="container">
    <section class="card">
      <div class="card-head">
        <h1>Inbox</h1>
        <span id="notifCountPill" class="pill">0 notifications</span>
      </div>
      <div class="card-body" id="notifList">
        <div class="empty-state">Loading…</div>
      </div>
    </section>
  </div>

  <script src="{% static 'js/api.js' %}"></script>
  <script src="{% static 'js/common.js' %}"></script>
  <script>
    // home / create 에서 쓰는 헬퍼 그대로
    async function api(path, opts={}) {
      const res = await fetch(`/api${path}`, {
        credentials: 'same-origin',
        ...opts,
        headers: { ...(opts.headers||{}), ...getHeaders() }
      });
      let data = null; try{ data = await res.json(); }catch{}
      if (!res.ok) throw new Error(data?.detail || `${res.status} ${res.statusText}`);
      return data;
    }

    function esc(s='') {
      return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    function navigateToEntry(id) {
      if (!id) return;
      window.location.href = `/entries/${id}/`;
    }

    async function loadAllNotifications() {
      const list = document.getElementById('notifList');
      const pill = document.getElementById('notifCountPill');

      try {
        list.innerHTML = '<div class="empty-state">Loading…</div>';

        // 홈 카드에서는 limit=5, 여기서는 넉넉하게 예: 200
        const res = await api('/inbox/notifications/?limit=200', { method:'GET' });
        const items = res.items || [];

        const countText = items.length === 1
          ? '1 notification'
          : `${items.length} notifications`;
        pill.textContent = countText;

        if (!items.length) {
          list.innerHTML = '<div class="empty-state">No notifications yet.</div>';
          return;
        }

        list.innerHTML = '';

        items.forEach(n => {
          const row = document.createElement('div');
          row.className = 'notif-item';

          const main = document.createElement('div');
          main.className = 'notif-main';

          const avatarDiv = document.createElement('div');
          avatarDiv.className = 'notif-avatar';
          const imgSrc = (n.actor && n.actor.image) ? n.actor.image : '{% static "images/default_pfp.png" %}';
          avatarDiv.innerHTML = `<img src="${imgSrc}" alt="${esc(n.actor?.display_name || 'User')}">`;

          const textWrap = document.createElement('div');
          textWrap.className = 'notif-text';

          const actorName = esc(n.actor?.display_name || 'Someone');
          const verb = esc(n.verb || '');
          const created = n.created ? new Date(n.created).toLocaleString() : '';

          let inner = `
            <div class="notif-actor">${actorName}</div>
            <div class="notif-verb">${verb}</div>
            `;

            // comment 알림일 경우 → verb 바로 아래 미리보기 표시
        if (n.type === 'comment' && n.comment_preview) {
            inner += `
                <div style="font-size:13px;color:#4b5563;margin:2px 0 4px;">
                “${esc(n.comment_preview)}”
                </div>
            `;
            }

            // 마지막 줄 = created time
        inner += `
            <div class="notif-meta">${created}</div>
            `;

        textWrap.innerHTML = inner;

          main.appendChild(avatarDiv);
          main.appendChild(textWrap);

          const actions = document.createElement('div');
          actions.className = 'notif-actions';
          const btn = document.createElement('button');
          btn.className = 'btn-view';
          btn.textContent = 'View';
          btn.onclick = () => {
            if (n.object_id) {
              navigateToEntry(n.object_id);
            } else if (n.object_url) {
              window.location.href = n.object_url;
            }
          };
          actions.appendChild(btn);

          row.appendChild(main);
          row.appendChild(actions);
          list.appendChild(row);
        });

      } catch (e) {
        console.error(e);
        list.innerHTML = `<div class="empty-state">Failed to load notifications. ${esc(e.message || e)}</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', loadAllNotifications);
  </script>
</body>
</html>
